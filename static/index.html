<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cinema Booking</title>
<style>
  body { font-family: sans-serif; text-align: center; background: #1a1a2e; color: #eee; }
  select, input { padding: 8px; margin: 8px; border-radius: 4px; border: none; }
  .grid { display: inline-block; margin-top: 20px; }
  .row { display: flex; justify-content: center; margin-bottom: 6px; }
  .seat { width: 34px; height: 34px; margin: 3px; border: none; border-radius: 4px; font-size: 11px; cursor: pointer; }
  .available { background: #4caf50; color: white; }
  .held { background: #e0a800; color: white; cursor: not-allowed; }
  .booked { background: #777; color: #ccc; cursor: not-allowed; }
  #panel { margin-top: 20px; min-height: 40px; }
  #panel button { margin: 0 6px; padding: 8px 16px; cursor: pointer; }
  #status { min-height: 20px; color: #f39c12; }
</style>
</head>
<body>
<h1>🎬 Cinema Booking</h1>
<div>
  <input id="userId" placeholder="Your name" value="guest">
  <select id="movieSelect"></select>
</div>
<div class="grid" id="seatGrid"></div>
<div id="panel"></div>
<p id="status"></p>

<script>
let movieCfg = {};
let currentMovie = null;
let currentSession = null;

function userId() {
  return document.getElementById('userId').value.trim() || 'guest';
}

async function loadMovies() {
  const movies = await fetch('/movies').then(r => r.json());
  const select = document.getElementById('movieSelect');
  select.innerHTML = movies.map(m => `<option value="${m.id}">${m.title}</option>`).join('');
  movies.forEach(m => movieCfg[m.id] = m);
  select.onchange = () => loadSeats(select.value);
  currentMovie = movies[0].id;
  loadSeats(currentMovie);
}

async function loadSeats(movieID) {
  currentMovie = movieID;
  const cfg = movieCfg[movieID];
  const booked = await fetch(`/movies/${movieID}/seats`).then(r => r.json());
  const statusById = {};
  booked.forEach(b => { statusById[b.seat_id] = b.confirmed ? 'booked' : 'held'; });

  const grid = document.getElementById('seatGrid');
  grid.innerHTML = '';
  for (let r = 0; r < cfg.rows; r++) {
    const rowLetter = String.fromCharCode(65 + r);
    const rowDiv = document.createElement('div');
    rowDiv.className = 'row';
    for (let n = 1; n <= cfg.seats_per_row; n++) {
      const seatId = rowLetter + n;
      const status = statusById[seatId] || 'available';
      const btn = document.createElement('button');
      btn.className = `seat ${status}`;
      btn.textContent = seatId;
      if (status === 'available') btn.onclick = () => holdSeat(seatId);
      rowDiv.appendChild(btn);
    }
    grid.appendChild(rowDiv);
  }
}

async function holdSeat(seatId) {
  const res = await fetch(`/movies/${currentMovie}/seats/${seatId}/hold`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ user_id: userId() })
  });
  const body = await res.json();
  if (!res.ok) { setStatus(body.error || 'Could not hold seat'); return; }
  currentSession = body;
  showPanel(seatId);
  setStatus('');
}

function showPanel(seatId) {
  document.getElementById('panel').innerHTML = `
    <p>Seat ${seatId} held for you. Confirm within 2 minutes or it's released automatically.</p>
    <button onclick="confirmSession()">Confirm booking</button>
    <button onclick="releaseSession()">Cancel</button>
  `;
}

async function confirmSession() {
  const res = await fetch(`/sessions/${currentSession.session_id}/confirm`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ user_id: userId() })
  });
  const body = await res.json();
  if (!res.ok) { setStatus(body.error || 'Could not confirm'); return; }
  currentSession = null;
  document.getElementById('panel').innerHTML = '';
  setStatus('Booking confirmed!');
  loadSeats(currentMovie);
}

async function releaseSession() {
  const res = await fetch(`/sessions/${currentSession.session_id}`, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ user_id: userId() })
  });
  currentSession = null;
  document.getElementById('panel').innerHTML = '';
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    setStatus(body.error || 'Could not release');
  } else {
    setStatus('Hold released.');
  }
  loadSeats(currentMovie);
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }

loadMovies();
</script>
</body>
</html>
